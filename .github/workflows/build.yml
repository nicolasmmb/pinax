name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão explícita (ex.: v0.2.0). Vazio = incremento automático do patch."
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          head_tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-v:refname | head -n1)"

          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          elif [ -n "${head_tag}" ]; then
            # Reexecução do mesmo commit: reaproveita a tag já criada.
            version="${head_tag#v}"
          else
            latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
            if [ -z "${latest}" ]; then
              version="0.1.0"
            else
              base="${latest#v}"
              base="${base%%-*}"
              IFS=. read -r major minor patch <<< "${base}"
              case "${major}${minor}${patch}" in
                '' | *[!0-9]*)
                  echo "tag semver inválida: ${latest}" >&2
                  exit 1
                  ;;
              esac
              major=$((10#${major}))
              minor=$((10#${minor}))
              patch=$((10#${patch} + 1))
              version="${major}.${minor}.${patch}"
            fi
          fi

          version="${version#v}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "versão inválida: ${version}" >&2
            exit 1
          fi

          commit="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "version=v${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"
          echo "versão: v${version} (commit ${commit})"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            output: pinax-linux-x64
          - name: macos-arm64
            os: macos-15
            output: pinax-macos-arm64
          - name: windows-x64
            os: windows-latest
            output: pinax-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify target architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "runner: $(uname -s) $(uname -m)"
          case "${{ matrix.name }}" in
            linux-x64)
              [ "$(uname -m)" = "x86_64" ] || { echo "esperado x86_64"; exit 1; }
              ;;
            macos-arm64)
              [ "$(uname -m)" = "arm64" ] || { echo "esperado arm64"; exit 1; }
              ;;
            windows-x64)
              [ "$(uname -m)" = "x86_64" ] || { echo "esperado x86_64"; exit 1; }
              ;;
          esac

      - name: Verify C toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version

      - name: Install pdf_oxide native library
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(go list -m -f '{{.Version}}' github.com/yfedoseev/pdf_oxide/go)"
          VERSION="${VERSION#v}"

          # Keep the native library inside the workspace so CGO paths are
          # deterministic on every runner. On Windows, Git Bash understands
          # POSIX paths but GCC needs a Windows-style path with forward slashes.
          if command -v cygpath >/dev/null 2>&1; then
            PDF_OXIDE_DIR="$(cygpath -m "${GITHUB_WORKSPACE}/.pdf_oxide")"
          else
            PDF_OXIDE_DIR="${GITHUB_WORKSPACE}/.pdf_oxide"
          fi

          go run "github.com/yfedoseev/pdf_oxide/go/cmd/install@v${VERSION}" \
            -version "${VERSION}" \
            -dir "${PDF_OXIDE_DIR}"

          echo "PDF_OXIDE_DIR=${PDF_OXIDE_DIR}" >> "${GITHUB_ENV}"

      - name: Configure CGO
        shell: bash
        run: |
          set -euo pipefail

          case "${RUNNER_OS}" in
            Linux)
              LIB_DIR=linux_amd64
              SYSTEM_LIBS="-lm -lpthread -ldl -lrt -lgcc_s -lutil -lc"
              ;;
            macOS)
              LIB_DIR=darwin_arm64
              SYSTEM_LIBS="-framework CoreFoundation -framework Security -framework SystemConfiguration -liconv -lresolv"
              ;;
            Windows)
              LIB_DIR=windows_amd64
              SYSTEM_LIBS="-lws2_32 -luserenv -lbcrypt -ladvapi32 -lcrypt32 -lsynchronization -lntdll -lkernel32 -lntoskrnl -lole32 -lshell32"
              ;;
            *)
              echo "runner não suportado: ${RUNNER_OS}"
              exit 1
              ;;
          esac

          {
            echo "CGO_ENABLED=1"
            echo "CGO_CFLAGS=-I${PDF_OXIDE_DIR}/include"
            echo "CGO_LDFLAGS=${PDF_OXIDE_DIR}/lib/${LIB_DIR}/libpdf_oxide.a ${SYSTEM_LIBS}"
          } >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          BUILD_COMMIT: ${{ needs.version.outputs.commit }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
        run: |
          set -euo pipefail

          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${BUILD_VERSION} -X main.commit=${BUILD_COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o "dist/${{ matrix.output }}" ./cmd/pinax

      - name: Smoke test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          output="dist/${{ matrix.output }}"
          set +e
          message="$("./${output}" 2>&1)"
          status=$?
          set -e

          echo "${message}"
          if [ "${status}" -eq 0 ]; then
            echo "esperado código de saída != 0 sem argumentos"
            exit 1
          fi
          echo "${message}" | grep -q "usage: pinax"

          version_output="$("./${output}" --version)"
          echo "${version_output}"
          echo "${version_output}" | grep -Fq "pinax ${EXPECTED_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: pinax-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          ls -lh dist

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${VERSION} já existe; atualizando assets"
            gh release upload "${VERSION}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${VERSION}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --generate-notes
          fi
